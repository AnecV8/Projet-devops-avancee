# Pipeline CI/CD : lint + tests -> images Docker -> Docker Hub
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:          # chaque PR est testée avant la fusion
  workflow_dispatch:     # lancement manuel depuis l'onglet Actions

jobs:
  backend:
    name: Back-end (tests + couverture)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Tests, couverture JaCoCo et analyse statique SpotBugs
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Conserver les rapports (tests, couverture, analyse statique)
        if: always()                     # aussi quand un test échoue : c'est là qu'on en a besoin
        uses: actions/upload-artifact@v4
        with:
          name: rapports-backend
          path: |
            app/backend/target/surefire-reports/
            app/backend/target/site/jacoco/
            app/backend/target/spotbugsXml.xml
          retention-days: 14

  integration:
    name: Tests d'intégration (API + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Construire le jar
        run: chmod +x mvnw && ./mvnw -B -q package -DskipTests
      - name: Lancer l'API avec PostgreSQL et tester register + login
        run: sh integration-test.sh

  frontend:
    name: Front-end (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint        # analyse statique (ESLint)
      - run: npm run test:run    # tests unitaires (Vitest)
      - run: npm run build

  dockerfiles:
    name: Analyse des Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/backend/Dockerfile
          failure-threshold: error
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/frontend/Dockerfile
          failure-threshold: error

  images:
    name: Build et push des images
    # Seulement sur main, et seulement si tous les contrôles sont verts
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, integration, frontend, dockerfiles]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Tag = SHA court du commit
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Image back-end
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jat-backend:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jat-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Image front-end
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jat-frontend:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jat-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Résumé
        run: |
          echo "### Images publiées : tag ${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Déploiement : ansible-playbook deploy.yml -e app_version=${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
  deploy-staging:
    name: Déploiement en staging
    # Après chaque publication des images sur main : déploie la même version sur le staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: [self-hosted, staging]        # runner installé sur la machine du staging (GitHub ne peut pas la joindre)
    concurrency:
      group: staging                       # un seul déploiement du staging à la fois
      cancel-in-progress: false
    environment:
      name: staging
      url: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      # Runner Windows (PC d'un membre de l'équipe) : script PowerShell
      - name: Déployer la version publiée (Windows)
        if: runner.os == 'Windows'
        working-directory: staging
        shell: cmd
        env:
          DH: ${{ secrets.DOCKERHUB_USERNAME }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File deploy-staging.ps1 ${{ needs.images.outputs.tag }}

      # Runner Linux (VM de staging installée par ansible/docker.yml) : script bash.
      # Les secrets du staging sont dans /etc/jat-staging.env, écrit par Ansible depuis le vault.
      - name: Déployer la version publiée (Linux)
        if: runner.os != 'Windows'
        working-directory: staging
        shell: bash
        run: |
          set -a; . /etc/jat-staging.env; set +a
          bash deploy-staging.sh ${{ needs.images.outputs.tag }}

      - name: Résumé (Windows)
        if: always() && runner.os == 'Windows'
        shell: cmd
        run: |
          echo ### Staging : version ${{ needs.images.outputs.tag }} - ${{ job.status }} >> "%GITHUB_STEP_SUMMARY%"

      - name: Résumé (Linux)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          echo "### Staging : version ${{ needs.images.outputs.tag }} - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
