# STAGING : toute l'application (PostgreSQL + API + front) sur une seule machine.
#
# Toutes les commandes se lancent depuis le dossier staging/.
#
# 1) Images construites depuis le code local (SANS DH/TAG) :
#      docker compose up -d --build
#
# 2) Images publiées par la CI sur Docker Hub (SANS --build, sinon le code local
#    serait construit et étiqueté avec le nom de l'image officielle) :
#      bash       : DH=<user> TAG=<sha> docker compose pull
#                   DH=<user> TAG=<sha> docker compose up -d
#      PowerShell : $env:DH="<user>"; $env:TAG="<sha>"
#                   docker compose pull; docker compose up -d
#                   Remove-Item Env:DH, Env:TAG     # sinon DH/TAG restent actifs
#
# 3) Déploiement semi-automatique (pull + vérification de santé + rollback si échec) :
#      bash       : ./deploy-staging.sh [sha]       (sans sha : dernière version publiée par la CI)
#      PowerShell : .\deploy-staging.ps1 [sha]
#
# Supervision : Prometheus http://localhost:9090, Grafana http://localhost:3000, cAdvisor http://localhost:8081
#
# Ports par défaut : front 8080, API 8082. Si un port est déjà pris sur la machine :
#      bash       : BACKEND_PORT=8092 docker compose up -d
#      PowerShell : $env:BACKEND_PORT="8092"; docker compose up -d
#
# Les mêmes images tournent en prod (Kubernetes) : seules les variables changent.
name: jat-staging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging-pass}
    volumes:
      - db-data:/var/lib/postgresql/data      # les données survivent à un "down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${DH:-local}/jat-backend:${TAG:-latest}
    build: ../app/backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jobtracker   # "db" = nom DNS du service
      SPRING_DATASOURCE_USERNAME: jobtracker
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-staging-pass}
      JWT_SECRET: ${JWT_SECRET:-staging-secret-staging-secret-staging-secret-1234}
    ports:
      - "${BACKEND_PORT:-8082}:8080"          # accès direct à l'API et à /actuator
    depends_on:
      db:
        condition: service_healthy            # Spring attend que PostgreSQL réponde
    restart: unless-stopped

  frontend:
    image: ${DH:-local}/jat-frontend:${TAG:-latest}
    build: ../app/frontend
    environment:
      BACKEND_URL: http://backend:8080        # nginx transmet /api au back
    ports:
      - "${FRONTEND_PORT:-8080}:8080"         # l'application : http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------- Supervision ----------------
  # Prometheus collecte les métriques, cAdvisor expose celles des conteneurs,
  # Grafana les affiche (dashboard "Golden signals" chargé automatiquement).

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus           # l'historique des métriques survit à un "down"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"       # http://localhost:9090/targets
    restart: unless-stopped

  cadvisor:
    # v0.55+ obligatoire avec Docker 29 (images stockées par containerd) : en v0.52,
    # cAdvisor ne retrouvait plus les conteneurs et ne remontait aucune métrique par conteneur.
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    privileged: true                          # lit les cgroups de l'hôte pour mesurer chaque conteneur
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      # Provisioning = configuration en fichiers (IaC) : datasource + dashboards, aucun clic
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"          # http://localhost:3000 (admin / admin)
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    # Stockage des logs (configuration locale fournie par l'image : fichiers sur disque)
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki                       # les logs survivent à un "down"
    ports:
      - "${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  alloy:
    # Collecte les logs de chaque conteneur via l'API Docker, ajoute service + level, envoie à Loki
    image: grafana/alloy:v1.9.0
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  db-data:
  prometheus-data:
  loki-data:
