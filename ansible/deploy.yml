# Déploie (ou met à jour) l'appli sur le cluster, sans coupure :
#   ansible-playbook deploy.yml --ask-vault-pass -e app_version=abc1234
- name: Déployer Job Application Tracker sur k3s
  hosts: k3s_server
  become: true
  tasks:
    - name: Copier les manifests Kubernetes sur le serveur
      ansible.builtin.copy:
        src: ../k8s/
        dest: "{{ app_dir }}/k8s/"
        mode: "0644"

    - name: Créer le dossier de l'overlay
      ansible.builtin.file:
        path: "{{ app_dir }}/overlay"
        state: directory
        mode: "0755"

    - name: Générer l'overlay avec les images et la version à déployer
      ansible.builtin.copy:
        dest: "{{ app_dir }}/overlay/kustomization.yml"
        mode: "0644"
        content: |
          # Généré par Ansible : la base k8s/ + le nom et le tag des images
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../k8s
          images:
            - name: jat-backend
              newName: {{ dockerhub_user }}/jat-backend
              newTag: "{{ app_version }}"
            - name: jat-frontend
              newName: {{ dockerhub_user }}/jat-frontend
              newTag: "{{ app_version }}"

    - name: Créer le namespace
      ansible.builtin.command: k3s kubectl apply -f {{ app_dir }}/k8s/namespace.yml
      register: ns
      changed_when: "'created' in ns.stdout"

    - name: Créer ou mettre à jour le Secret (mot de passe BDD, clé JWT)
      ansible.builtin.shell: |
        set -o pipefail
        manifest=$(k3s kubectl -n jat create secret generic jat-secret \
          --from-literal=DB_PASSWORD='{{ db_password }}' \
          --from-literal=JWT_SECRET='{{ jwt_secret }}' \
          --dry-run=client -o yaml)
        # "kubectl diff" renvoie 0 si rien ne change : on n'applique que s'il y a une différence
        if echo "$manifest" | k3s kubectl diff -f - > /dev/null 2>&1; then
          echo "INCHANGE"
        else
          echo "$manifest" | k3s kubectl apply -f -
        fi
      args:
        executable: /bin/bash
      no_log: true                 # le mot de passe n'apparaît pas dans les logs
      register: secret
      changed_when: "'INCHANGE' not in secret.stdout"

    - name: Appliquer tous les manifests (kubectl apply -k sur l'overlay)
      # "apply" affiche "configured" pour certains objets (StatefulSet, PDB) même sans vrai changement :
      # on compare d'abord avec "kubectl diff", et on n'applique que s'il y a une vraie différence.
      ansible.builtin.shell: |
        if k3s kubectl diff -k {{ app_dir }}/overlay/ > /dev/null 2>&1; then
          echo "INCHANGE"
        else
          k3s kubectl apply -k {{ app_dir }}/overlay/
        fi
      args:
        executable: /bin/bash
      register: apply
      changed_when: "'INCHANGE' not in apply.stdout"
      failed_when: apply.rc != 0

    - name: Attendre la fin du rolling update du back
      ansible.builtin.command: k3s kubectl -n jat rollout status deployment/backend --timeout=300s
      changed_when: false

    - name: Attendre la fin du rolling update du front
      ansible.builtin.command: k3s kubectl -n jat rollout status deployment/frontend --timeout=120s
      changed_when: false

    - name: Afficher l'état final
      ansible.builtin.command: k3s kubectl -n jat get pods,svc,hpa,ingress -o wide
      register: state
      changed_when: false

    - name: Résultat
      ansible.builtin.debug:
        msg: "{{ state.stdout_lines }}"
