# Cibles surveillées par Prometheus en STAGING (docker-compose).
# Prometheus fonctionne en mode "pull" : il interroge lui-même chaque cible toutes les 15 s.
# Les noms (backend, cadvisor) sont les noms DNS des services du compose.
# En prod (Kubernetes), c'est un ServiceMonitor qui déclare le back-end à Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus lui-même
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques applicatives Spring Boot (Micrometer) : requêtes HTTP, JVM, CPU du process
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          environment: staging

  # Métriques de chaque conteneur Docker (CPU, mémoire, réseau) : le signal "saturation"
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: staging
