# Source de données Loki créée automatiquement au démarrage de Grafana (IaC, aucun clic).
apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Dans un log du back, "trace_id=..." devient un lien vers la trace complète dans Tempo
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id=(\w+)'
          url: '$${__value.raw}'
          datasourceUid: tempo
