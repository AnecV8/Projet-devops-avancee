# Source de données Tempo (traces) créée automatiquement au démarrage de Grafana (IaC, aucun clic).
# Depuis une trace, le bouton "Logs for this span" ouvre les logs Loki qui portent le même trace_id.
apiVersion: 1
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{project="jat-staging", service="backend"} |= "$${__trace.traceId}"'
