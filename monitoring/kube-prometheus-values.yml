# Valeurs Helm de kube-prometheus-stack (Prometheus + Grafana + exporters) pour la PROD k3s
grafana:
  # adminPassword : passé par Ansible depuis le vault (grafana_admin_password)
  service:
    type: NodePort
    nodePort: 30300               # Grafana : http://<IP d'une VM>:30300
  sidecar:
    dashboards:
      enabled: true               # charge les ConfigMaps étiquetées grafana_dashboard=1
      label: grafana_dashboard
prometheus:
  service:
    type: NodePort
    nodePort: 30090               # Prometheus : http://<IP d'une VM>:30090
  prometheusSpec:
    # Prend en compte TOUS les ServiceMonitor du cluster (dont le nôtre)
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 2d
    resources:
      requests: { cpu: 100m, memory: 400Mi }
alertmanager:
  enabled: false                  # pas d'alertes pour la démo (amélioration possible)
# k3s regroupe ces composants dans un seul binaire et ne les expose pas comme kubeadm :
# sans ces lignes, Prometheus afficherait des cibles DOWN et des alertes "firing".
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
